services:
  postgres:
    image: postgres:16-alpine
    container_name: familiemunshi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familie_munshi_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-9016}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-familie_munshi_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - familiemunshi-net

  minio:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:alpine AS builder
        RUN go install github.com/minio/minio@latest
        
        FROM alpine:latest
        RUN apk add --no-cache ca-certificates curl
        COPY --from=builder /go/bin/minio /usr/local/bin/minio
        VOLUME ["/data"]
        EXPOSE 9000 9001
        ENTRYPOINT ["/usr/local/bin/minio"]
        CMD ["server", "/data", "--console-address", ":9001"]
    container_name: familiemunshi-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - familiemunshi-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familiemunshi-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/familie_munshi_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-9016}

      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-familiemunshi-bucket}

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - familiemunshi-net

networks:
  familiemunshi-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

  minio_data:
    driver: local