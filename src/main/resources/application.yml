spring:
  application:
    name: familiemunshi
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  autoconfigure:
    # JWT-only auth: no in-memory user / generated password
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
  messages:
    basename: messages.messages
    fallback-to-system-locale: false
    encoding: UTF-8

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

bootstrap:
  super-admin:
    enabled: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
    first-name: ${SUPER_ADMIN_FIRST_NAME:}
    last-name: ${SUPER_ADMIN_LAST_NAME:}
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}



branch-admin:
  email-domain: ${BRANCH_ADMIN_EMAIL_DOMAIN}
  common-password: ${BRANCH_ADMIN_COMMON_PASSWORD}

storage:
  type: ${STORAGE_TYPE:minio}

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000

file:
  upload-dir: uploads
  allowed-extensions: jpg,jpeg,png,webp,pdf
  max-size-bytes: 10485760